[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nullbench"
version = "0.8.1"
description = "Open-source null-first decision lab with M1 seals and M4 external vault notary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "nullbench contributors" }]
keywords = [
  "preregistration",
  "null-model",
  "proper-scoring",
  "e-values",
  "reproducibility",
  "decision-evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "build>=1.2",
  "twine>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# Optional giants — thin adapters live under nullbench.scoring
stats = [
  "properscoring>=0.1",
  # comparecast needs confseq (MSVC on Windows); pure-Python port is always on
  "comparecast>=1.0; platform_system != 'Windows'",
]
# combinatorial coverage search (OR-Tools) — not code-coverage tooling
coverage = [
  "ortools>=9.8",
]

[project.scripts]
nullbench = "nullbench.cli:app"

[project.urls]
Homepage = "https://github.com/taipei49314/nullbench"
Documentation = "https://github.com/taipei49314/nullbench#readme"
Issues = "https://github.com/taipei49314/nullbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nullbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "m1: M1 product gate — adversarial integrity IC-01..08 (must pass)",
  "m4: M4 product gate — vault notary / A5 rewrite detection",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # line length handled by formatter budget
  "B008",  # Typer Option/Argument defaults are idiomatic
  "UP042", # keep str, Enum for pydantic compat
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B018"]
"src/nullbench/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["nullbench"]
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "ortools.*",
  "properscoring.*",
  "comparecast.*",
  "scipy.*",
  "numpy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["nullbench"]
omit = [
  "*/nullbench/cli.py",
  "*/nullbench/__main__.py",
  "*/nullbench/coverage/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
