[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nullbench"
version = "0.2.0"
description = "Pre-register decisions. Score them against chance. Never backfill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "nullbench contributors" }]
keywords = [
  "preregistration",
  "null-model",
  "proper-scoring",
  "e-values",
  "reproducibility",
  "decision-evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "build>=1.2",
  "twine>=5.0",
]
# Optional giants — thin adapters live under nullbench.scoring
stats = [
  "properscoring>=0.1",
]

[project.scripts]
nullbench = "nullbench.cli:app"

[project.urls]
Homepage = "https://github.com/taipei49314/nullbench"
Documentation = "https://github.com/taipei49314/nullbench#readme"
Issues = "https://github.com/taipei49314/nullbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nullbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
