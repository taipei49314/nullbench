name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: M1 product gate
        run: python -m pytest -m m1 --tb=line
      - name: Public API import smoke
        run: python -c "from nullbench import init_study, add_strategy, freeze_period, settle_period, build_report, __version__; print(__version__)"
      - name: Maturity CLI
        run: python -m nullbench maturity
      - name: Demo smoke
        run: |
          python -m nullbench demo --name ci-demo --path /tmp --periods 5
          test -f /tmp/ci-demo/reports/latest.md
          test -f /tmp/ci-demo/reports/latest.html

  sbom:
    name: SBOM (M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build env
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: nullbench-sbom
          path: sbom.cdx.json
