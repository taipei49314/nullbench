name: Feature request
description: Propose a change that fits the product non-goals
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: nongals
    attributes:
      label: Non-goals check
      options:
        - label: This is not real-money betting / prediction productization
          required: true
        - label: I read docs/PRD.md and docs/CLAIM_POLICY.md
          required: true
